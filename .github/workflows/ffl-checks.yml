name: FFL source checks

on:
  push:
    branches: ['feature/katy-foundation']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  rules-and-build:
    name: Rules and reproducible preview
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run rule, privacy, audit and boundary tests
        run: npm test
      - name: Verify generated preview
        run: npm run build:check
